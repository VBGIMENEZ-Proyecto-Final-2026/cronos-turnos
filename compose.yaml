# Base de datos local de cronos. Las variables salen del .env (ver .env.example).
# Escucha solo en 127.0.0.1: no se expone a la red ZeroTier.
services:
  db:
    image: postgres:17-alpine
    container_name: cronos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CRONOS_DB_NAME:?definir CRONOS_DB_NAME en .env}
      POSTGRES_USER: ${CRONOS_DB_USER:?definir CRONOS_DB_USER en .env}
      POSTGRES_PASSWORD: ${CRONOS_DB_PASSWORD:?definir CRONOS_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${CRONOS_DB_PORT:-5434}:5432"
    volumes:
      - cronos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cronos-db-data:
